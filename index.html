<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d12"><title>100 Günlük TYT + AYT Yol Haritası</title></head><body style="margin:0;background:#080b10;color:#fff;font-family:system-ui"><div style="padding:24px">Uygulama yükleniyor…</div><script>window.__Y100G="";</script>
<script src="./chunks/00.js"></script>
<script src="./chunks/01.js"></script>
<script src="./chunks/02.js"></script>
<script src="./chunks/03.js"></script>
<script>(async()=>{const b=Uint8Array.from(atob(window.__Y100G),c=>c.charCodeAt(0));const ds=new DecompressionStream("gzip");const html=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML='<div style="padding:24px">Uygulama yüklenemedi: '+e+'</div>'});</script></body></html>
